- name: "programs"
    label: "Program Creator"
    folder: "src/programs"
    create: true
    slug: "{{slug}}"
    preview_path: "programs/{{slug}}"
    fields:
      - {label: "Program Name", name: "title", widget: "string"}
      - {label: "URL Slug", name: "slug", widget: "string", hint: "e.g., dansing"}
      - {label: "SEO Meta Description", name: "description", widget: "text"}
      - {label: "Cover Image", name: "image", widget: "image"}
      - {label: "Content Body", name: "body", widget: "markdown"}
      - name: "fields_of_study"
    label: "Teacher Programs Creator"
    folder: "src/fields"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Field Name", name: "title", widget: "string"}
      - {label: "Description", name: "intro", widget: "text", required: false}
      - {label: "Display Order", name: "weight", widget: "number", default: 0}
      - name: "teachers"
    label: "Teacher Creator"
    folder: "src/teachers"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Teacher Name", name: "title", widget: "string"}
      - {label: "Field of Study", name: "field", widget: "relation", collection: "fields_of_study", search_fields: ["title"], value_field: "title", multiple: true}
      - {label: "Profile Photo", name: "photo", widget: "image"}
      - {label: "Bio", name: "body", widget: "markdown"}
      - {label: "Video Embed Code", name: "video", widget: "string", required: false}
      - name: "blog"
    label: "Blog Creator"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image"}
      - {label: "Body", name: "body", widget: "markdown"}
